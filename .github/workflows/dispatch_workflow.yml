name: dispatch_workflow

on:
  workflow_dispatch:
    inputs:
      execution_type:
        description: "Execution mode"
        required: true
        default: "unsharded"
        type: choice
        options:
          - sharded
          - unsharded
      shards:
        description: "Number of shards to use (only applicable for sharded execution)"
        required: false
        default: 4
        type: number
      workers:
        description: "Number of workers to use per run (or per shard for sharded execution)"
        required: false
        default: 4
        type: number
      playwright_args:
        description: "Optional additional Playwright args (example: tests --grep @smoke)"
        required: false
        default: ""
        type: string

run-name: "Run tests (${{ github.event.inputs.execution_type }}) - Shards: ${{ github.event.inputs.shards }} - Workers: ${{ github.event.inputs.workers }}"

jobs:
  run-unsharded:
    if: ${{ github.event.inputs.execution_type == 'unsharded' }}
    runs-on: ubuntu-latest
    env:
      STANTERPRISE_GRPC_ADDRESS: grpc.observer.rocks:443
      WORKERS: ${{ github.event.inputs.workers }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Ensure runner scripts are executable
        run: chmod +x ./unsharded-run.sh

      - name: Run unsharded tests
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_ARGS="${{ github.event.inputs.playwright_args }}"

          if [[ -n "$PLAYWRIGHT_ARGS" ]]; then
            read -r -a EXTRA_ARGS <<< "$PLAYWRIGHT_ARGS"
          else
            EXTRA_ARGS=()
          fi

          ./unsharded-run.sh "${EXTRA_ARGS[@]}"

  prepare-shard-matrix:
    if: ${{ github.event.inputs.execution_type == 'sharded' }}
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.set-matrix.outputs.shard_matrix }}
      total_shards: ${{ steps.set-matrix.outputs.total_shards }}

    steps:
      - name: Build shard matrix from input
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          TOTAL_SHARDS='${{ github.event.inputs.shards }}'

          if ! [[ "$TOTAL_SHARDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid shards input: $TOTAL_SHARDS"
            exit 1
          fi

          SHARD_MATRIX="$(seq 1 "$TOTAL_SHARDS" | jq -R -s -c 'split("\n")[:-1] | map(tonumber)')"

          echo "shard_matrix=$SHARD_MATRIX" >> "$GITHUB_OUTPUT"
          echo "total_shards=$TOTAL_SHARDS" >> "$GITHUB_OUTPUT"

  run-sharded:
    needs: prepare-shard-matrix
    if: ${{ github.event.inputs.execution_type == 'sharded' }}
    runs-on: ubuntu-latest
    env:
      STANTERPRISE_GRPC_ADDRESS: grpc.observer.rocks:443
      WORKERS: ${{ github.event.inputs.workers }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare-shard-matrix.outputs.shard_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run shard ${{ matrix.shard }}/${{ needs.prepare-shard-matrix.outputs.total_shards }}
        shell: bash
        env:
          STANTERPRISE_RUN_ID: ${{ github.run_id }}
          STANTERPRISE_TEST_RUN_NAME: Sharded Test (GH Actions)
          STANTERPRISE_META_MARKER: test
        run: |
          set -euo pipefail
          PLAYWRIGHT_ARGS="${{ github.event.inputs.playwright_args }}"

          if [[ -n "$PLAYWRIGHT_ARGS" ]]; then
            read -r -a EXTRA_ARGS <<< "$PLAYWRIGHT_ARGS"
          else
            EXTRA_ARGS=()
          fi

          npx playwright test --shard="${{ matrix.shard }}/${{ needs.prepare-shard-matrix.outputs.total_shards }}" "${EXTRA_ARGS[@]}"
